name: QA

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drizzle_transact
          POSTGRES_PASSWORD: drizzle_transact
          POSTGRES_DB: drizzle_transact
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_transact
          PGPASSWORD: drizzle_transact
          PGDATABASE: drizzle_transact

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drizzle_transact
          POSTGRES_PASSWORD: drizzle_transact
          POSTGRES_DB: drizzle_transact
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run coverage
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: drizzle_transact
          PGPASSWORD: drizzle_transact
          PGDATABASE: drizzle_transact
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
